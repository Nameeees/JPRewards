  bonus-bloqueado: '&eThat bonus unlocks at a &f{racha_minima} &estreak; you are at &f{racha}&e.'
  bonus-ya-reclamado: '&7You already claimed the &f{racha_minima} &7bonus in this streak.'
  nada-disponible: '&7No streak bonus is ready to claim.'

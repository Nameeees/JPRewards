# ============================================================================
#  JPRewards - recompensas/semanales.yml
# ----------------------------------------------------------------------------
#  Ciclo de la recompensa SEMANAL. La clave es el numero de bloque (1..N).
#  Se reclama UNA vez por semana: la semana empieza el dia configurado en
#  config.yml -> semanal.dia-inicio, a la hora de reinicio.hora.
#  Weekly reward cycle: one claim per week, starting on semanal.dia-inicio.

#  Los premios semanales conviene que sean claramente mejores que los
#  diarios: son el motivo para entrar cada semana.
#  Mismos campos que diarias.yml (lore, comandos, items, efectos, rangos...).
# ============================================================================


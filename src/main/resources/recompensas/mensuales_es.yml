# ============================================================================
#  JPRewards - recompensas/mensuales.yml
# ----------------------------------------------------------------------------
#  HITOS DEL MES: se desbloquean acumulando dias con la diaria reclamada
#  DENTRO del mes actual. Al cambiar de mes el progreso y los hitos
#  reclamados se reinician solos (lo historico se conserva en /top hitos).
#  Monthly milestones: unlocked by claiming the daily reward within the month.

#  La clave de cada hito es su id (aparece en el menu y en las acciones).
#  'dias-requeridos' es lo unico obligatorio ademas del premio.
#  Mismos campos que diarias.yml (lore, comandos, items, efectos, rangos...).

#  Febrero tiene 28 dias: manten los hitos alcanzables en cualquier mes.
# ============================================================================


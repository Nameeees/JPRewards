    lore:
      - '&7▪ &f10000 &7{moneda}'
      - '&7▪ &f10x &bDiamond'
      - '&7▪ &f1x &f&lLegendary key &7(via command)'
      - '&830 days in a row without missing'
    comandos:
      - 'eco give {jugador} 10000'
      - 'crates give {jugador} legendaria 1'
    items:
      - 'DIAMOND 10'
      - 'DIAMOND_BLOCK 3'
    experiencia: 1000
    efectos:
      sonido: ENTITY_PLAYER_LEVELUP

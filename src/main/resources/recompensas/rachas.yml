    # Per-rank variants: the same permissions as in the other files.
    rangos:
      mvip:
        permiso: 'jprewards.rewards.mvip'
        lore:
          - '&8Streak of 30 days for rank &6&lMVIP'
          - '&7▪ &f25000 &7{moneda}'
          - '&7▪ &f25x &bDiamond'
          - '&7▪ &f2x &f&lLlave legendaria'
        comandos:
          - 'eco give {jugador} 25000'
          - 'crates give {jugador} legendaria 2'
        items:
          - 'DIAMOND 25'
        experiencia: 2000

  # WEEKLY streak bonus: 4 weeks claimed in a row.
  racha-semanal-4:

# ============================================================================
#  JPRewards - recompensas/rachas.yml  (English)
# ----------------------------------------------------------------------------
#  STREAK BONUSES: unlocked by reaching N days (or weeks) IN A ROW.
#  They can be claimed once per streak; if the player loses the streak they
#  become available again.
#  A Spanish copy ships as rachas_es.yml.
#
#  FIELDS
#    tipo: diaria | semanal   which streak counts (daily by default)
#    racha-minima: N          days or weeks in a row required
#    (every other field is the same as in diarias.yml)
#
#  This module can be switched off in config.yml -> modulos.rachas.
# ============================================================================

config-version: 2

bonus:

  # At 7 days in a row (a full week without missing a day).
  racha-7:
    tipo: diaria
    racha-minima: 7
    nombre: '&ePerfect week'
    icono:
      textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMTQ4OTY5YzU2MmI3MTFlZGQxOTJmMTU3NjIxOTk5MDk1ZDM3MmNjNzhkOTEwZTY5MjA3ZjY2ODQ5OWNjNmRmYyJ9fX0='
    lore:
      - '&7▪ &f1000 &7{moneda}'
      - '&7▪ &e1x &6Vote key &7(via command)'
      - '&8Reward for 7 days in a row'
    comandos:
      - 'eco give {jugador} 1000'
    items:
      - 'DIAMOND 2'
    experiencia: 100
    efectos:
      particula: HAPPY_VILLAGER
      particulas: 15
      accion-bar: '&e7 day streak reached!'

  # At 30 days in a row: the big consistency reward.
  racha-30:
    tipo: diaria
    racha-minima: 30
    nombre: '&6&lPerfect month'
    icono:
      textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZTM0YTU5MmE3OTM5N2E4ZGYzOTk3YzQzMDkxNjk0ZmMyZmI3NmM4ODNhNzZjY2U4OWYwMjI3ZTVjOWYxZGZlIn19fQ=='
    lore:
      - '&7▪ &f10000 &7{moneda}'
      - '&7▪ &f10x &bDiamond'
      - '&7▪ &f1x &f&lLegendary key &7(via command)'
      - '&830 days in a row without missing'
    comandos:
      - 'eco give {jugador} 10000'
      - 'crates give {jugador} legendaria 1'
    items:
      - 'DIAMOND 10'
      - 'DIAMOND_BLOCK 3'
    experiencia: 1000
    efectos:
      sonido: ENTITY_PLAYER_LEVELUP
      fuegos: true
      broadcast: '&6{jugador} &7reached a &630 day&7 streak!'
    # Per-rank variants: the same permissions as in the other files.
    rangos:
      mvip:
        permiso: 'jprewards.rewards.mvip'
        lore:
          - '&8Streak of 30 days for rank &6&lMVIP'
          - '&7▪ &f25000 &7{moneda}'
          - '&7▪ &f25x &bDiamond'
          - '&7▪ &f2x &f&lLlave legendaria'
        comandos:
          - 'eco give {jugador} 25000'
          - 'crates give {jugador} legendaria 2'
        items:
          - 'DIAMOND 25'
        experiencia: 2000

  # WEEKLY streak bonus: 4 weeks claimed in a row.
  racha-semanal-4:
    tipo: semanal
    racha-minima: 4
    nombre: '&dMonth of perfect weeks'
    icono:
      textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMWE2OTZlMTUyMzYzYWQ0NzdlZDZjYjVhNTE4YmZlYTg0YjAzNjE0OGZlY2FjMDU4MWYzMmM1YjUzOTY5NTgifX19'
    lore:
      - '&7▪ &f5000 &7{moneda}'
      - '&7▪ &f5x &bDiamond'
      - '&84 weeks claimed in a row'
    comandos:
      - 'eco give {jugador} 5000'
    items:
      - 'DIAMOND 5'
    experiencia: 400
    efectos:
      fuegos: true
      broadcast: '&d{jugador} &7claimed 4 weeks in a row!'

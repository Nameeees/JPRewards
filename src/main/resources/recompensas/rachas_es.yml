      - '&7▪ &f5000 &7{moneda}'
      - '&7▪ &f5x &bDiamante'
      - '&84 semanas seguidas reclamando'
    comandos:
      - 'eco give {jugador} 5000'
    items:
      - 'DIAMOND 5'

# ============================================================================
#  JPRewards - menus.yml
# ----------------------------------------------------------------------------
#  TODO el aspecto de los menus se define aqui: titulos, texturas, botones,
#  estados, paginacion y navegacion. No hace falta tocar el plugin.
#  Every menu title, texture, button, state, pagination and navigation lives
#  here. No code changes needed.
#
#  ESTRUCTURA DE UN MENU / MENU STRUCTURE
#    menu-xxx:
#      titulo: '...'            texto del inventario (acepta {pagina},{paginas})
#      filas: 1-6               alto del cofre
#      slot-inicial: 10         donde empiezan los items automaticos (ciclos)
#      slots: [10, 11, 12]      (opcional) slots exactos para esos items
#      navegacion: {volver-slot, cerrar-slot}
#      paginacion: {anterior-slot, siguiente-slot, info-slot}
#      botones: { ... }
#
#  CAMPOS DE UN BOTON / BUTTON FIELDS
#    slot / slots         posicion (o lista: [10, 11] o '10-16')
#    material             material moderno; en 1.8 el plugin usa el equivalente
#    textura              value base64 de una cabeza (minecraft-heads.com)
#    textura-jugador      cabeza de un jugador por nombre (en vez de textura)
#    cantidad             1-64
#    nombre / lore        textos con & y {placeholders}; admite {preview}
#    brillo               true = efecto encantado sin encantamiento visible
#    encantamientos:      { SHARPNESS: 3, UNBREAKING: 1 }
#    item-flags:          [HIDE_ATTRIBUTES, HIDE_ENCHANTS]
#    custom-model-data    1.14+ (se ignora en versiones antiguas)
#    irrompible           true = unbreakable (1.11+) o durabilidad oculta
#    icono-recompensa     true = en 'hoy'/'disponible' usa la cabeza del premio
#    permiso              permiso necesario para verlo/usarlo
#    ocultar-sin-permiso  true = si no tiene el permiso, el boton no se ve
#    accion / accion-<estado>   una accion o varias separadas por ';'
#
#  ESTADOS / STATES (se eligen solos segun los datos del jugador)
#    diaria:   hoy | reclamado | bloqueado
#    semanal:  disponible | reclamado | bloqueado
#    mensual:  disponible | bloqueado | reclamado
#    rachas:   disponible | bloqueado | reclamado
#    principal: disponible | reclamada | bloqueada | completada | nada
#  Para cada estado puedes definir: nombre-<estado>, lore-<estado>,
#  textura-<estado>, brillo-<estado> y accion-<estado>.
#
#  ACCIONES / ACTIONS
#    open:<menu> | close | none
#    claim:daily | claim:weekly | claim:monthly | claim:streaks
#    claim:all | claim:milestone:<id> | claim:streak:<id>
#    command:<cmd> | player-command:<cmd> | message:<clave de messages> | sound:<nombre>
#    (varias a la vez separadas por ';' -- se ejecutan en orden)
#
#  PLACEHOLDERS / PLACEHOLDERS
#    {jugador} {uuid} {mundo} {dia} {dias} {racha} {mejor} {total}
#    {semana} {semanas} {racha_semanal} {mejor_semanal} {total_semanal}
#    {dias_mes} {dias_mes_total} {hitos} {hitos_total} {hitos_disponibles}
#    {bonus} {bonus_total} {bonus_disponibles} {pendientes} {tiempo}
#    {tiempo_largo} {tiempo_semanal} {hora} {moneda} {premio} {estado}
#    {cantidad} {faltan} {racha_minima} {hito} {vacio} {pagina} {paginas}
#    {barra_mes} {barra_ciclo} {barra_racha} {barra_racha_semanal}
#    {version} {servidor} {almacenamiento} {modulos}
#    Y cualquier %placeholder% de PlaceholderAPI si esta instalado.
#
#  Las texturas incluidas vienen de minecraft-heads.com (uso libre).
# ============================================================================

